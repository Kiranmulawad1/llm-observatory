[project]
name = "lo-core"
version = "0.1.0"
description = "Shared domain layer: models, schemas, evaluators, services"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "jinja2>=3.1.5",
    "redis>=5.2",
    "structlog>=24.4",
    # `regex`, not stdlib `re`: evaluator patterns are supplied by API callers,
    # and stdlib re has no way to bound backtracking. See evaluators/deterministic.py.
    "regex>=2024.11",
    "jsonschema>=4.23",
    "httpx>=0.28",
    # Official SDK rather than raw HTTP: it owns retry/backoff, streaming and
    # typed errors, and it is a thin dependency (httpx + pydantic, both already
    # present here).
    "anthropic>=0.69",
    "openai>=1.60",
    # Self-observability: metric definitions are shared by the API and the
    # worker, so they live in core and cannot drift apart.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Local embedding inference, needed only by the worker. Kept optional so the API
# image does not carry onnxruntime and a model file it never loads.
local-embeddings = ["fastembed>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo_core"]
