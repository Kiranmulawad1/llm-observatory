[project]
name = "llm-observatory-sdk"
version = "0.1.0"
description = "Client SDK for the llm-observatory tracing API"
readme = "README.md"
# Deliberately wider than the platform's own floor: this package is installed
# into OTHER teams' applications, so it must not force a Python upgrade on them.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# One runtime dependency, on purpose. An observability SDK that drags in a
# dependency tree is an SDK teams refuse to adopt.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_observatory"]
