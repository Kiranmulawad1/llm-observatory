name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run. Without this, a busy PR
# queues redundant jobs and the useful result is the one you wait longest for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.16"

jobs:
  python-quality:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen fails if uv.lock is stale relative to the pyproject files.
      # Without it, CI would silently resolve different versions than the images.
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps

  sdk-boundary:
    name: SDK dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # ADR 0001: the published SDK must not depend on platform-internal code.
      # A stray `import lo_core` passes every local test and only breaks once a
      # consumer installs from PyPI, so it is checked explicitly here.
      - name: Reject platform imports in the SDK
        run: |
          if grep -rnE '^\s*(from|import)\s+(lo_core|lo_api|lo_worker)' packages/sdk/src; then
            echo "::error::SDK must not import platform-internal packages (see ADR 0001)"
            exit 1
          fi
      - name: Install the SDK alone and import it
        run: |
          uv venv /tmp/sdk-env
          VIRTUAL_ENV=/tmp/sdk-env uv pip install ./packages/sdk
          VIRTUAL_ENV=/tmp/sdk-env uv run --no-project python -c "import llm_observatory; print(llm_observatory.__version__)"

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: lo
          POSTGRES_PASSWORD: lo_test_password
          POSTGRES_DB: llm_observatory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lo -d llm_observatory"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LO_ENVIRONMENT: local
      LO_DATABASE_URL: postgresql+asyncpg://lo:lo_test_password@localhost:5432/llm_observatory
      LO_REDIS_URL: redis://localhost:6379/0
      LO_API_KEY_PEPPER: ci-test-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # GitHub's `services:` cannot mount an init script, so the TimescaleDB
      # extension that docker-compose installs via infra/docker/postgres-init is
      # applied here. The schemas themselves are created by the migration runner
      # (see migrations/env.py), so this step is only about the extension.
      - name: Create extension and schemas
        run: |
          PGPASSWORD=lo_test_password psql -h localhost -U lo -d llm_observatory \
            -f infra/docker/postgres-init/01-init.sql
      - name: Apply migrations
        run: uv run alembic upgrade head
      # Migrations must be reversible, and the only way to know is to run the
      # downgrade. Doing it on an empty CI database is free; discovering a broken
      # downgrade during a production rollback is not. The re-upgrade leaves the
      # schema in place for the test run that follows.
      - name: Verify migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      # Fails if a model was changed without generating the matching migration.
      # That mistake is invisible locally — the developer's database already has
      # the column, because SQLAlchemy never needed it to exist in a migration —
      # and only surfaces as a broken deploy against a fresh database.
      - name: Check models and migrations agree
        run: uv run alembic check
      - run: uv run pytest --cov=packages --cov=apps --cov-report=term-missing

  web-quality:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          # The wrapper intercepts stdout to expose it as step outputs, which
          # mangles multi-line plan output for anything downstream.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: initialise providers and modules without touching the
      # GCS state bucket. CI has no credentials for it and does not need any —
      # validation is a local, offline, type-checking operation.
      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend=false

      # This is the step that earns its keep. `validate` resolves every
      # resource argument against the downloaded provider schemas, so a
      # misspelled attribute or a wrong type fails here rather than half way
      # through an apply that has already created a VPC.
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubectl: "1.32.0"
          kubeconform: "0.6.7"

      # The kind overlay's secretGenerator reads secrets.env, which is
      # gitignored by design (ADR 0011: a credential is never a committed
      # file). It therefore does not exist in a CI checkout, and without it
      # `kubectl kustomize` cannot render the overlay at all. Synthesise a
      # throwaway one with the same keys: rendering only needs the keys to
      # exist, and these values never leave the runner. The file stays
      # untracked, so the "Reject committed Secret manifests" gate below is
      # unaffected.
      - name: Synthesise a throwaway secrets.env for rendering
        run: |
          cat > infra/k8s/overlays/kind/secrets.env <<'EOF'
          POSTGRES_PASSWORD=ci-render-only
          LO_DATABASE_URL=postgresql+asyncpg://lo:ci-render-only@postgres:5432/llm_observatory
          LO_REDIS_URL=redis://redis:6379/0
          LO_API_KEY_PEPPER=ci-render-only
          LO_ADMIN_TOKEN=ci-render-only
          EOF

      - name: Render and validate every overlay
        run: |
          set -euo pipefail
          for overlay in base overlays/kind overlays/gcp; do
            echo "::group::$overlay"
            # Rendering is itself a test: a bad patch target or a missing
            # resource fails here, and it is the failure mode Kustomize is
            # most prone to.
            kubectl kustomize "infra/k8s/$overlay" > "/tmp/$(basename "$overlay").yaml"
            echo "::endgroup::"
          done
          kubeconform -strict -summary /tmp/base.yaml
          kubeconform -strict -summary /tmp/kind.yaml
          # The gcp overlay references CRDs (ManagedCertificate, BackendConfig,
          # ExternalSecret) whose schemas only exist inside a cluster that has
          # them installed. Skipped, not ignored — everything else is strict.
          kubeconform -strict -summary -ignore-missing-schemas /tmp/gcp.yaml

      # Cheap, high-value invariant: no committed Secret object, anywhere.
      #
      # Checking for a `data:` key would be wrong — ConfigMaps legitimately
      # have one. What must not exist is a `kind: Secret` manifest in the
      # repository at all: locally the Secret is generated from a gitignored
      # envs file, and in production it is materialised in-cluster by the
      # External Secrets Operator from GCP Secret Manager. Either way it is
      # never a file. This is what stops the convenient shortcut from being
      # merged on a Friday afternoon.
      - name: Reject committed Secret manifests
        run: |
          if grep -rn --include='*.yaml' -E '^\s*kind:\s*Secret\s*$' infra/k8s; then
            echo "::error::no Secret manifest may be committed (see ADR 0011)"
            exit 1
          fi
          # And the rendered output must not contain a literal credential
          # either — a secretGenerator pointed at a committed file would slip
          # past the check above.
          if git ls-files --error-unmatch infra/k8s/overlays/kind/secrets.env 2>/dev/null; then
            echo "::error::infra/k8s/overlays/kind/secrets.env must stay gitignored"
            exit 1
          fi

  kind-e2e:
    name: Deploy to a real cluster
    runs-on: ubuntu-latest
    needs: [python-quality, python-tests, web-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: llm-observatory
          config: infra/k8s/overlays/kind/kind-cluster.yaml

      - name: Build and load images
        run: |
          docker build -f apps/api/Dockerfile    -t llm-observatory/api:dev .
          docker build -f apps/worker/Dockerfile -t llm-observatory/worker:dev .
          docker build -f apps/web/Dockerfile    -t llm-observatory/web:dev apps/web
          kind load docker-image llm-observatory/api:dev    --name llm-observatory
          kind load docker-image llm-observatory/worker:dev --name llm-observatory
          kind load docker-image llm-observatory/web:dev    --name llm-observatory

      - name: Generate cluster secrets
        run: |
          PGPASS=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))")
          cat > infra/k8s/overlays/kind/secrets.env <<EOF
          POSTGRES_PASSWORD=$PGPASS
          LO_DATABASE_URL=postgresql+asyncpg://lo:$PGPASS@lo-postgres:5432/llm_observatory
          LO_REDIS_URL=redis://lo-redis:6379/0
          LO_API_KEY_PEPPER=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          LO_ADMIN_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          EOF

      # The manifests are only really validated by a cluster accepting them and
      # the pods becoming ready. Schema validation catches typos; this catches
      # a probe pointing at the wrong path, a secret key that does not exist,
      # and a securityContext the image cannot actually run under.
      - name: Deploy
        run: |
          kubectl apply -k infra/k8s/overlays/kind
          kubectl wait --for=condition=complete job/lo-migrate -n llm-observatory --timeout=300s
          kubectl rollout status deployment/lo-api    -n llm-observatory --timeout=300s
          kubectl rollout status deployment/lo-worker -n llm-observatory --timeout=300s
          kubectl rollout status deployment/lo-web    -n llm-observatory --timeout=300s

      - name: Smoke test through the NodePort
        run: |
          set -euo pipefail
          ADMIN=$(grep '^LO_ADMIN_TOKEN=' infra/k8s/overlays/kind/secrets.env | cut -d= -f2)
          curl -fsS localhost:30800/healthz
          curl -fsS localhost:30800/readyz
          # Auth is on in the cluster too, so an unauthenticated call must fail.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:30800/projects)" = 401
          curl -fsS -X POST localhost:30800/projects \
            -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' \
            -d '{"slug":"smoke","name":"Smoke"}'
          curl -fsS localhost:30300 > /dev/null

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n llm-observatory -o wide
          kubectl describe pods -n llm-observatory
          kubectl logs -n llm-observatory -l app.kubernetes.io/part-of=llm-observatory --all-containers --tail=200

  images:
    name: Build images
    runs-on: ubuntu-latest
    # Images are only worth building once the code that goes in them is sound.
    needs: [python-quality, python-tests, web-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: worker
            dockerfile: apps/worker/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # CI proves the image builds; pushing and deploying belong to cd.yml,
          # which gates on a manual approval before terraform apply (Phase 10).
          push: false
          load: true
          tags: lo-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
