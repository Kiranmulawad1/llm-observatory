apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-observatory

resources:
  - ../../base
  # Redis only. Postgres lives in base because *both* environments self-host it
  # — Cloud SQL cannot load the timescaledb extension (ADR 0011). Redis is the
  # one that genuinely differs: managed Memorystore in GCP, a StatefulSet here.
  - redis.yaml

patches:
  - path: networkpolicy-patch.yaml
  - path: nodeport-patch.yaml
  - path: scale-down-patch.yaml

configMapGenerator:
  # Point the applications at the in-cluster database and Redis. This merges
  # into the base ConfigMap rather than replacing it.
  - name: lo-config
    behavior: merge
    literals:
      - LO_ENVIRONMENT=local
      - LO_LOG_LEVEL=DEBUG

secretGenerator:
  # Sourced from a gitignored file, generated by `make kind-up`. Nothing
  # secret is committed, and the local cluster still gets real random values
  # rather than a placeholder that teaches the wrong habit.
  #
  # In the gcp overlay this Secret is materialised by the External Secrets
  # Operator from GCP Secret Manager instead — same name, same keys, so
  # nothing in base/ knows or cares where the values came from.
  - name: lo-secrets
    envs:
      - secrets.env

# Kustomize appends a content hash to generated names and rewrites every
# reference, so editing a secret rolls the pods that consume it. Without this
# a changed Secret sits unread until something unrelated triggers a restart.
generatorOptions:
  disableNameSuffixHash: false

images:
  - name: llm-observatory/api
    newTag: dev
  - name: llm-observatory/worker
    newTag: dev
  - name: llm-observatory/web
    newTag: dev
