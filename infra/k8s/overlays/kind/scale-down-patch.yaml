# One replica each. A laptop-sized cluster does not benefit from two, and
# scheduling two pods with a PDB of minAvailable: 1 on a single node makes
# `kind delete`-and-recreate cycles slower for no additional coverage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lo-api
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lo-worker
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lo-web
spec:
  replicas: 1
