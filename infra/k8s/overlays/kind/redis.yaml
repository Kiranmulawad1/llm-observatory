# Redis for the arq queue and the ingest rate limiter.
#
# appendonly yes: a queued eval job that vanishes because Redis restarted is
# exactly the silent failure this platform exists to prevent. The gcp overlay
# replaces this with Memorystore, which is the same trade made by someone else.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lo-redis
spec:
  serviceName: lo-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lo-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lo-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lo-redis
  labels:
    app.kubernetes.io/name: lo-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lo-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
