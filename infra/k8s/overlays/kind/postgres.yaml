# TimescaleDB in-cluster.
#
# This is the local stand-in for the production database, and in this project
# production runs the same way — Cloud SQL cannot load the `timescaledb`
# extension, and `telemetry.spans` is a hypertable. See ADR 0011.
#
# A StatefulSet rather than a Deployment: the pod needs a stable name and its
# own PersistentVolumeClaim that survives rescheduling. A Deployment with a PVC
# would let two pods attach the same volume during a rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lo-postgres
spec:
  serviceName: lo-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lo-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: timescale/timescaledb:2.17.2-pg17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: lo
            - name: POSTGRES_DB
              value: llm_observatory
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lo-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory, not the mount point itself. A PVC's root is
            # created by the kubelet with fsGroup permissions that initdb
            # rejects as too permissive; a subdirectory is created by initdb
            # with the 0700 it insists on.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lo", "-d", "llm_observatory"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lo", "-d", "llm_observatory"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: initdb
          configMap:
            name: lo-postgres-init
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lo-postgres
  labels:
    app.kubernetes.io/name: lo-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
