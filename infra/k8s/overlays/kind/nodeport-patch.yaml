# NodePort rather than an Ingress for the local cluster.
#
# kind maps these fixed ports to the host in kind-cluster.yaml, so the stack is
# reachable at localhost with no ingress controller, no LoadBalancer and no
# cloud. The gcp overlay uses a real Ingress instead; keeping the difference in
# the overlays is the point of having overlays.
apiVersion: v1
kind: Service
metadata:
  name: lo-web
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: lo-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
