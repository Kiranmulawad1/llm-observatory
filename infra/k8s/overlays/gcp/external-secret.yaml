# Secrets come from GCP Secret Manager, at runtime, via the External Secrets
# Operator. No credential is ever committed, templated, base64'd into a
# manifest, or passed through Terraform state.
#
# The chain is worth following, because it is the part that has no password in
# it anywhere:
#
#   1. Terraform creates the Secret Manager *containers* (never the values —
#      a value in a .tf file is a value in state, which is a value in a bucket).
#   2. A human or a CI job writes the values with `gcloud secrets versions add`.
#   3. The `lo-secrets` Kubernetes ServiceAccount is annotated for Workload
#      Identity, so it authenticates to GCP as a Google service account using a
#      projected, short-lived token — no JSON key file exists to be stolen.
#   4. This ExternalSecret tells the operator to read those secrets and
#      materialise a Kubernetes Secret named `lo-secrets`.
#
# Base manifests reference `lo-secrets` and know nothing about any of it, which
# is why the same base works unchanged against `kustomize secretGenerator`
# locally.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID_PLACEHOLDER
      auth:
        workloadIdentity:
          clusterLocation: REGION_PLACEHOLDER
          clusterName: llm-observatory
          serviceAccountRef:
            name: lo-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lo-secrets
  annotations:
    # Bound to a Google service account by Terraform (modules/iam). The binding
    # is what lets this pod call Secret Manager without holding a key.
    iam.gke.io/gcp-service-account: lo-external-secrets@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lo-secrets
spec:
  # Re-read every hour, so rotating a secret in Secret Manager propagates
  # without a redeploy. The Secret's resourceVersion changes, which is what a
  # reloader (or a rollout) keys off to restart consumers.
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: lo-secrets
    creationPolicy: Owner
  data:
    - secretKey: LO_DATABASE_URL
      remoteRef: { key: lo-database-url }
    - secretKey: LO_REDIS_URL
      remoteRef: { key: lo-redis-url }
    - secretKey: LO_API_KEY_PEPPER
      remoteRef: { key: lo-api-key-pepper }
    - secretKey: LO_ADMIN_TOKEN
      remoteRef: { key: lo-admin-token }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: lo-postgres-password }
    - secretKey: LO_ANTHROPIC_API_KEY
      remoteRef: { key: lo-anthropic-api-key }
