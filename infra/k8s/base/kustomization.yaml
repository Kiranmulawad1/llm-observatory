apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-observatory

# Applied to every resource. `part-of` is what makes `kubectl get all -l
# app.kubernetes.io/part-of=llm-observatory` return the whole application
# rather than a guess based on name prefixes.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: llm-observatory
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - worker-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - postgres.yaml
  - migrate-job.yaml
  - pdb.yaml
  - networkpolicy.yaml

configMapGenerator:
  # Extensions and schemas, applied once when the data volume is first created.
  # Table DDL is Alembic's job — see infra/docker/postgres-init/01-init.sql,
  # which this is a copy of so that compose and Kubernetes bootstrap identically.
  - name: lo-postgres-init
    files:
      - 01-init.sql=postgres-init.sql

# Image tags are set by the overlay, never edited here. `kustomize edit set
# image` in CI rewrites these to a digest, which is the only reference that
# cannot be re-pointed under you after the fact.
images:
  - name: llm-observatory/api
    newTag: dev
  - name: llm-observatory/worker
    newTag: dev
  - name: llm-observatory/web
    newTag: dev
