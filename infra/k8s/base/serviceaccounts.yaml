# One ServiceAccount per workload, not one shared account.
#
# They hold no permissions today — nothing here talks to the Kubernetes API.
# They exist because identity is the thing you cannot retrofit: the gcp overlay
# annotates these for Workload Identity so each workload authenticates to GCP
# as itself, and a shared account would mean the web frontend and the worker
# are indistinguishable to IAM and to the audit log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lo-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lo-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lo-web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lo-migrate
automountServiceAccountToken: false
