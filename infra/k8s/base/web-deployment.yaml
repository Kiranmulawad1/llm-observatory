apiVersion: apps/v1
kind: Deployment
metadata:
  name: lo-web
  labels:
    app.kubernetes.io/name: lo-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lo-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lo-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: lo-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: llm-observatory/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-side only. This is the BFF: the Next.js server holds the
            # operator token and proxies, so the browser never receives a
            # credential. Note there is no NEXT_PUBLIC_ variable here — that
            # prefix inlines a value into the JavaScript bundle, which for a
            # token means publishing it.
            - name: LO_API_BASE_URL
              value: http://lo-api:8000
            - name: LO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lo-secrets
                  key: LO_ADMIN_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
