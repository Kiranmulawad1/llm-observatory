# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. The URL is read from LO_DATABASE_URL
# via lo_core.config inside migrations/env.py, so a database password never
# lands in a file that gets committed, and migrations resolve the same
# connection string the application itself uses.

[alembic]
script_location = migrations
prepend_sys_path = .

# UTC-timestamped revision filenames sort chronologically in the directory
# listing, which makes the history readable without running `alembic history`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Fail rather than silently truncate an over-long autogenerated slug.
truncate_slug_length = 40

[post_write_hooks]
# Autogenerated migrations are formatted with the same tooling as the rest of
# the repo, so a generated file never fails the `make lint` gate in CI.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
