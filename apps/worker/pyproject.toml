[project]
name = "lo-worker"
version = "0.1.0"
description = "Arq worker: async eval jobs, guardrail sampling, metric rollups"
requires-python = ">=3.13"
dependencies = [
    "lo-core",
    "arq>=0.26",
]

[tool.uv.sources]
lo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo_worker"]
