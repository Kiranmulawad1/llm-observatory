[project]
name = "lo-api"
version = "0.1.0"
description = "FastAPI control plane and trace ingestion API"
requires-python = ">=3.13"
dependencies = [
    # Required by FastAPI for the multipart dataset-upload endpoint.
    "python-multipart>=0.0.20",
    "lo-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "arq>=0.26",
    # OTLP ingest. Lives here rather than in `core` because OTLP is a wire
    # protocol, and ADR 0001 keeps `core` to the domain — the worker has no
    # business decoding protobuf, and each image installs only its own closure.
    "opentelemetry-proto>=1.29",
]

[tool.uv.sources]
lo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lo_api"]
